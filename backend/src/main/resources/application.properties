spring.application.name=petclinic-backend
server.port=8081

# ---------------------------------------------------------------------------
# HSQLDB in-memory database (seeded on startup from schema.sql + data.sql)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:hsqldb:mem:petclinic
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/hsqldb/schema.sql
spring.sql.init.data-locations=classpath*:db/hsqldb/data.sql

# JSON: Jackson 2 (Spring Boot 3) serializes java.time values as ISO strings by
# default; just tolerate unknown fields on the wire.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Solace PubSub+ connection (PubSub+ Messaging API for Java)
# ---------------------------------------------------------------------------
solace.host=tcp://localhost:55554
solace.vpn=default
solace.username=default
solace.password=default

# Actuator (development convenience)
management.endpoints.web.exposure.include=*

logging.level.org.springframework=INFO
# Solace client debug logging (PubSub+ Java API + underlying JCSMP transport)
logging.level.com.solace=INFO
logging.level.com.solacesystems=INFO