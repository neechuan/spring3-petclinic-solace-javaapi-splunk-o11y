spring.application.name=petclinic-frontend
server.port=8080

# Web / view layer
spring.thymeleaf.mode=HTML
spring.messages.basename=messages/messages
spring.web.resources.cache.cachecontrol.max-age=12h

# JSON: Jackson 2 (Spring Boot 3) serializes java.time values as ISO strings by
# default; just tolerate unknown fields on the wire.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Solace PubSub+ connection (PubSub+ Messaging API for Java) and request/reply timeout
# ---------------------------------------------------------------------------
solace.host=tcp://localhost:55554
solace.vpn=default
solace.username=default
solace.password=default
solace.request.timeout-ms=10000

# Actuator (development convenience)
management.endpoints.web.exposure.include=*

logging.level.org.springframework=INFO
# Solace client debug logging (PubSub+ Java API + underlying JCSMP transport)
logging.level.com.solace=TRACE
logging.level.com.solacesystems=TRACE
